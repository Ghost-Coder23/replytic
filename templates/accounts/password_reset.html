{% extends "base/auth.html" %}
{% block title %}Reset password{% endblock %}
{% block content %}
<h1>Reset your password</h1>
<p class="sub">Enter your email and we'll send a link to choose a new password.</p>
<form method="post" novalidate data-loading-form>
  {% csrf_token %}
  {% include "components/form_field.html" with field=form.email %}
  <button type="submit" class="btn btn-primary btn-lg w-100">Send reset link</button>
</form>
<p class="auth-switch"><a href="{% url 'accounts:login' %}"><i class="bi bi-arrow-left"></i> Back to sign in</a></p>
{% endblock %}
