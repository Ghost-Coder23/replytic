{% load static %}<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0f2a2d">
  <title>{% block title %}Replytic{% endblock %} &middot; Replytic</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 34 34'%3E%3Crect width='34' height='34' rx='10' fill='%230e8074'/%3E%3Crect x='8' y='8' width='18' height='12.5' rx='4' fill='%23fff'/%3E%3Cpath d='M12 20.4v5.1l5.4-5.1z' fill='%23fff'/%3E%3Ccircle cx='21.2' cy='14.2' r='2.3' fill='%23f4b740'/%3E%3C/svg%3E">
  <link rel="preload" href="{% static 'fonts/bricolage-grotesque-latin-wght-normal.woff2' %}" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="{% static 'vendor/bootstrap/bootstrap.min.css' %}">
  <link rel="stylesheet" href="{% static 'vendor/bootstrap-icons/bootstrap-icons.min.css' %}">
  <link rel="stylesheet" href="{% static 'css/replytic.css' %}">
  {% block extra_head %}{% endblock %}
</head>
<body class="{% block body_class %}{% endblock %}">
  <a class="visually-hidden-focusable btn btn-ink position-absolute m-2" href="#main">Skip to content</a>
  {% block body %}{% endblock %}
  <script src="{% static 'vendor/bootstrap/bootstrap.bundle.min.js' %}"></script>
  <script src="{% static 'js/app.js' %}"></script>
  {% block extra_js %}{% endblock %}
</body>
</html>
