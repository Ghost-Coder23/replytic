{% extends "base/auth.html" %}
{% block title %}Sign out{% endblock %}
{% block content %}
<h1>Sign out of Replytic?</h1>
<p class="sub">You'll need to sign in again to see your dashboard.</p>
<form method="post" action="{% url 'accounts:logout' %}">
  {% csrf_token %}
  <button type="submit" class="btn btn-primary btn-lg w-100 mb-2">Sign out</button>
  <a class="btn btn-outline-ink btn-lg w-100" href="{% url 'dashboard:index' %}">Stay signed in</a>
</form>
{% endblock %}
